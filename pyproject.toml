[project]
name = "stream-v2"
version = "0.2.0"
description = "Stream Partner V2 Application"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.41.3,<2",
    "celery>=5.6.0,<6",
    "dj-database-url>=3.0.1,<4",
    "django>=6.0,<7",
    "django-celery-results>=2.6.0,<3",
    "django-storages>=1.14.6,<2",
    "flower>=2.0.1,<3",
    "gunicorn>=23.0.0,<24",
    "pillow>=12.0.0,<13",
    "psycopg2-binary>=2.9.11,<3",
    "python-dotenv>=1.2.1,<2",
    "redis>=7.1.0,<8",
    "requests>=2.32.5,<3",
    "whitenoise>=6.11.0,<7",
    "django-celery-beat>=2.9.0,<3",
    "weasyprint>=68.1,<70",
    "django-anymail[resend]>=14.0,<15",
    "python-dateutil>=2.9.0,<3",
    "djangorestframework>=3.17.1,<4",
    "djoser>=2.3.3,<3",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "django-cors-headers>=4.9.0,<5",
    "cryptography>=49.0.0,<50",
    "pyotp>=2.10.0,<3",
    "qrcode[pil]>=8.2,<9",
    "django-structlog>=9.0.0,<10",
]

[dependency-groups]
dev = [
    "pytest-django>=4.9.0,<5",
    "pytest-cov>=5.0.0,<6",
    "factory-boy>=3.3.0,<4",
    "djangorestframework-stubs>=3.17.1,<4",
    "celery-types==0.24.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"
