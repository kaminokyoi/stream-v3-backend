name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest --nomigrations -q
      - run: uv run pip-audit 2>/dev/null || true
